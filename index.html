<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Countdown Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="widget-box">
    <div class="title">YOUR CURRENT SEASON</div>

    <!-- Start Button at the Top -->
    <button id="start-btn" class="btn primary-btn" onclick="startCountdown()">Start Countdown</button>

    <!-- Countdown Display -->
    <div class="countdown-display">
        <div class="time-block">
            <span id="days-count" class="time-number">--</span>
            <span class="time-label">DAYS</span>
        </div>
        <span class="time-separator">:</span>
        <div class="time-block">
            <span id="hours-count" class="time-number">--</span>
            <span class="time-label">HOURS</span>
        </div>
        <span class="time-separator">:</span>
        <div class="time-block">
            <span id="minutes-count" class="time-number">--</span>
            <span class="time-label">MINS</span>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Stop & Reset Buttons at the Bottom -->
    <div class="bottom-controls">
        <button id="stop-btn" class="btn secondary-btn" onclick="stopCountdown()">Stop</button>
        <button id="reset-btn" class="btn secondary-btn" onclick="resetCountdown()">Reset</button>
    </div>

    <div class="footer-text">Make these days count.</div>
</div>

<script src="script.js"></script>

</body>
</html>
